services:
  postgres:
    image: postgres:17
    container_name: postgres_wallet
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_password
      POSTGRES_DB: wallet_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: wallet_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: wallet_user
      SPRING_DATASOURCE_PASSWORD: wallet_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  frontend:
    build: ./wallet-frontend
    container_name: wallet_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - app

volumes:
  postgres_data: